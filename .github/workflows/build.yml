name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project NoCommentTube.xcodeproj \
            -scheme NoCommentTube \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/NoCommentTube.app Payload/
          zip -qry NoCommentTube.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: NoCommentTube-ipa
          path: NoCommentTube.ipa

      # 아이폰 Safari에서 .ipa를 바로 받을 수 있도록 릴리스에도 올린다.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: NoCommentTube.ipa
